<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1b33">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Marina</title>
<style>
  :root{
    --bg:#f4f1ea; --panel:#ffffff; --ink:#0f1b33; --muted:#6b7389; --line:#e6e0d3;
    --navy:#0f1b33; --navy2:#1c2f57; --gold:#c9a24a; --gold2:#e6c97f; --gold-soft:#f7efdc;
    --ok:#1f8a5b; --ok-soft:#e2f4ea; --warn:#c77a1c; --warn-soft:#fcf0de; --bad:#c43d3d; --bad-soft:#fbe6e6;
    --radius:16px; --shadow:0 1px 2px rgba(15,27,51,.05),0 6px 24px rgba(15,27,51,.07);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
  button,input,select,textarea{font:inherit;color:inherit}
  .app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
  aside{background:linear-gradient(180deg,#0f1b33,#0b1428);color:#cfd5e3;padding:24px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
  .brand{display:flex;align-items:center;gap:10px;padding:0 8px 22px}
  .logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#e6c97f,#b38a32);display:grid;place-items:center;color:#0f1b33;font-weight:800;font-size:19px;box-shadow:0 4px 14px rgba(201,162,74,.35)}
  .brand b{font-size:21px;color:var(--gold2);letter-spacing:.5px}
  .brand small{display:block;color:#8b93a9;font-size:11px}
  .nav{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:#cfd5e3}
  .nav:hover{background:rgba(255,255,255,.06)}
  .nav.active{background:var(--gold);color:var(--navy);font-weight:700}
  .nav .ic{width:18px;text-align:center}
  .nav .count{margin-inline-start:auto;background:var(--gold2);color:var(--navy);font-size:11px;font-weight:800;border-radius:20px;padding:1px 7px}
  .nav.active .count{background:var(--navy);color:var(--gold2)}
  .langs{display:flex;gap:6px;margin:14px 8px 0;background:rgba(255,255,255,.06);border-radius:10px;padding:4px}
  .langs button{flex:1;border:0;background:none;color:#cfd5e3;padding:6px;border-radius:7px;cursor:pointer;font-weight:600}
  .langs button.on{background:var(--gold);color:var(--navy)}
  .side-foot{margin-top:auto;font-size:12px;color:#7d859b;padding:8px;line-height:1.5}
  main{padding:28px 34px 60px;max-width:1320px;width:100%}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
  h1{margin:0;font-size:26px}
  .sub{color:var(--muted);margin-top:4px}
  h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
  h2 .tag{font-size:11px;font-weight:600;color:var(--muted);background:var(--bg);border-radius:20px;padding:2px 8px}
  .card{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px}
  .grid{display:grid;gap:18px}
  .stats{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:18px}
  .g2{grid-template-columns:1.2fr 1fr}
  .stat{display:flex;flex-direction:column;gap:4px;border-top:3px solid var(--gold)}
  .stat .n{font-size:26px;font-weight:700}
  .stat .l{color:var(--muted);font-size:12.5px}
  .btn{border:0;border-radius:10px;padding:9px 14px;cursor:pointer;background:var(--navy);color:var(--gold2);font-weight:700}
  .btn:hover{background:var(--navy2)}
  .btn.ghost{background:var(--gold-soft);color:var(--navy)}
  .btn.ghost:hover{background:#f1e4c4}
  .btn.plain{background:transparent;color:var(--muted);padding:6px 8px}
  .btn.sm{padding:6px 10px;font-size:12.5px}
  .btn.danger{background:var(--bad-soft);color:var(--bad)}
  input,select,textarea{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;width:100%;outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
  label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px;font-weight:600}
  .row{display:flex;gap:10px;align-items:center}
  .empty{color:var(--muted);font-size:13px;padding:10px 0}
  .check{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px dashed var(--line)}
  .check:last-child{border-bottom:0}
  .box{width:22px;height:22px;border-radius:7px;border:2px solid #cdd2dd;display:grid;place-items:center;cursor:pointer;flex-shrink:0;background:#fff;transition:.15s}
  .box.on{background:var(--navy);border-color:var(--navy)}
  .box.on::after{content:"✓";color:var(--gold2);font-size:13px;font-weight:900}
  .check.done .txt{text-decoration:line-through;color:var(--muted)}
  .txt{flex:1}
  .meta{font-size:12px;color:var(--muted)}
  .pill{font-size:11px;font-weight:700;border-radius:20px;padding:2px 9px;white-space:nowrap}
  .pill.new{background:var(--gold-soft);color:#8a6a1f}
  .pill.active,.pill.good{background:var(--ok-soft);color:var(--ok)}
  .pill.paused,.pill.watch{background:var(--warn-soft);color:var(--warn)}
  .pill.over,.pill.bad{background:var(--bad-soft);color:var(--bad)}
  .pill.ended,.pill.none{background:#eceef3;color:var(--muted)}
  .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;display:inline-block}
  .ci{display:grid;grid-template-columns:1fr 92px 92px;align-items:center;gap:8px;padding:9px 4px;border-bottom:1px dashed var(--line)}
  .ci:last-child{border-bottom:0}
  .ci.h{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--line)}
  .ci .c{display:flex;justify-content:center}
  .who{display:flex;align-items:center;gap:9px;min-width:0}
  .who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
  .client{display:flex;flex-direction:column;gap:10px;border-top:4px solid var(--c)}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .client h3,.camp h3{margin:0;font-size:16px}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px}
  .kv dt{color:var(--muted)} .kv dd{margin:0}
  .filters{display:flex;gap:6px;flex-wrap:wrap}
  .chipbtn{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;cursor:pointer;font-size:12.5px}
  .chipbtn.on{background:var(--navy);color:var(--gold2);border-color:var(--navy)}
  /* Calendar */
  .calbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .calbar .m{font-size:18px;font-weight:700;min-width:170px;text-align:center}
  .cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
  .dow{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding-bottom:2px}
  .day{background:#fff;border-radius:12px;min-height:112px;padding:8px;display:flex;flex-direction:column;gap:5px;box-shadow:var(--shadow);cursor:pointer;border:2px solid transparent}
  .day:hover{border-color:var(--gold-soft)}
  .day.out{opacity:.35}
  .day.today{border-color:var(--gold)}
  .day .dn{font-weight:700;font-size:13px;display:flex;justify-content:space-between}
  .day.today .dn b{background:var(--navy);color:var(--gold2);border-radius:7px;padding:0 6px}
  .post{display:flex;align-items:center;gap:6px;font-size:11.5px;padding:4px 6px;border-radius:7px;background:color-mix(in srgb,var(--c) 14%,white);border-inline-start:3px solid var(--c);cursor:pointer;line-height:1.25}
  .post .pb{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--c);flex-shrink:0;display:grid;place-items:center;background:#fff}
  .post.done .pb{background:var(--c)}
  .post.done .pb::after{content:"✓";color:#fff;font-size:9px;font-weight:900}
  .post.done .pt{text-decoration:line-through;opacity:.6}
  .post.late{background:var(--bad-soft);border-inline-start-color:var(--bad)}
  .pt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;margin-top:14px;color:var(--muted)}
  .legend span{display:flex;align-items:center;gap:6px}
  /* Campaigns */
  .camp{display:flex;flex-direction:column;gap:12px;border-top:4px solid var(--c)}
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .tiles.wide{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
  .tile{background:var(--bg);border-radius:10px;padding:8px 10px}
  .tile .v{font-weight:700;font-size:15px;direction:ltr;unicode-bidi:isolate}
  .tile .k{font-size:11px;color:var(--muted)}
  .tile.bad .v{color:var(--bad)} .tile.good .v{color:var(--ok)}
  .ins{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:10px;font-size:13px;line-height:1.5;margin-bottom:8px;background:var(--bg);border-inline-start:4px solid var(--muted)}
  .ins.bad{background:var(--bad-soft);border-color:var(--bad)}
  .ins.watch{background:var(--warn-soft);border-color:var(--warn)}
  .ins.good{background:var(--ok-soft);border-color:var(--ok)}
  .ins .i{font-size:15px}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{padding:8px 6px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
  th{color:var(--muted);font-weight:700;font-size:11px}
  td.n{direction:ltr;unicode-bidi:isolate}
  .tblwrap{overflow-x:auto}
  .calc{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .calc .out{background:var(--navy);color:var(--gold2);border-radius:10px;padding:10px 12px;margin-top:10px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
  .calc .out span:first-child{color:#cfd5e3;font-weight:600}
  .spark{width:100%;height:90px;background:var(--bg);border-radius:10px}
  /* Modal */
  .ov{position:fixed;inset:0;background:rgba(11,20,40,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  .ov.show{display:flex}
  .modal{background:#fff;border-radius:18px;padding:22px;width:min(540px,100%);max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);border-top:4px solid var(--gold)}
  .modal.wide{width:min(900px,100%)}
  .modal h3{margin:0 0 16px;font-size:18px}
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .fgrid .full{grid-column:1/-1}
  .hint{font-size:12px;color:var(--muted);background:var(--gold-soft);border-radius:10px;padding:8px 12px;margin-bottom:14px}
  .mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
  .mfoot .start{margin-inline-end:auto}
  .daypick{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .daypick button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 0;cursor:pointer;font-size:12.5px}
  .daypick button.on{background:var(--navy);color:var(--gold2);border-color:var(--navy)}
  .daypick .blank{visibility:hidden}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(90px);background:var(--navy);color:var(--gold2);padding:10px 18px;border-radius:12px;transition:.25s;z-index:60;font-weight:600}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .quick{display:flex;gap:8px;margin-top:10px}
  .x{opacity:0;cursor:pointer;color:var(--muted);border:0;background:none;padding:2px 6px}
  .check:hover .x,tr:hover .x{opacity:1}
  .banner{background:linear-gradient(120deg,#0b1428,#1c2f57 65%,#2d4374);color:#fff;border-radius:var(--radius);padding:20px 24px;display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:18px;border:1px solid rgba(201,162,74,.35)}
  .banner .big{font-size:22px;font-weight:700;color:var(--gold2)}
  .banner .ring{width:76px;height:76px;flex-shrink:0}
  .alert{display:flex;align-items:flex-start;gap:10px;padding:10px 4px;border-bottom:1px dashed var(--line);cursor:pointer}
  .alert:last-child{border-bottom:0}
  .day .posts{display:flex;flex-direction:column;gap:5px}
  .day.sel{border-color:var(--navy)}
  .lbls{display:none}
  .home{max-width:720px;margin:0 auto;display:grid;gap:16px}
  .home h1{font-size:24px}
  .tbar{background:linear-gradient(120deg,#0b1428,#1c2f57);color:var(--gold2);border-radius:14px;padding:14px 18px;display:grid;gap:10px;font-weight:700;border:1px solid rgba(201,162,74,.35)}
  .tbar .n{font-size:18px}
  .tbar .bar{height:8px;background:rgba(230,201,127,.2);border-radius:8px;overflow:hidden}
  .tbar .bar i{display:block;height:100%;background:var(--gold2);border-radius:8px;transition:width .3s}
  .grp{font-size:11.5px;font-weight:800;color:var(--muted);margin:14px 0 2px;letter-spacing:.3px}
  .grp:first-of-type{margin-top:2px}
  .mtop{display:none;align-items:center;gap:10px;background:var(--navy);color:var(--gold2);padding:calc(10px + env(safe-area-inset-top)) 14px 10px;position:sticky;top:0;z-index:30;box-shadow:0 4px 16px rgba(0,0,0,.2)}
  .mtop .logo{width:32px;height:32px;font-size:16px;border-radius:10px}
  .mtop b{font-size:18px;flex:1}
  .sync{font-size:11.5px;font-weight:700;color:var(--gold2);margin-bottom:6px}
  .sync[data-s="err"]{color:#ff9b8f} .sync[data-s="local"]{color:#8b93a9}
  .mtop .sync{margin:0;font-size:10.5px;max-width:42vw;text-align:end}
  .mtop .langs{margin:0;padding:3px}
  .mtop .langs button{padding:4px 10px;font-size:12px}
  @media (max-width:980px){.g2,.calc{grid-template-columns:1fr}.app{grid-template-columns:200px 1fr}main{padding:22px}}
  /* ===== Phone layout ===== */
  @media (max-width:760px){
    body{font-size:14.5px}
    .app{display:block}
    .mtop{display:flex}
    aside{position:fixed;inset:auto 0 0 0;height:auto;flex-direction:row;padding:6px 4px calc(6px + env(safe-area-inset-bottom));gap:2px;z-index:40;box-shadow:0 -4px 20px rgba(0,0,0,.25)}
    aside .brand,aside .langs,.side-foot{display:none}
    .nav{flex:1;flex-direction:column;gap:2px;padding:6px 2px;font-size:10.5px;justify-content:center;text-align:center;position:relative}
    .nav .ic{font-size:19px;width:auto}
    .nav .lbl{display:none} .nav .lbls{display:block}
    .nav .count{position:absolute;top:1px;inset-inline-end:6px;margin:0;font-size:9.5px;padding:0 5px}
    main{padding:14px 14px calc(92px + env(safe-area-inset-bottom))}
    h1{font-size:21px}
    .head{margin-bottom:14px;align-items:flex-start}
    .head .row{flex-wrap:wrap}
    .banner{padding:14px 16px;margin-bottom:14px}.banner .big{font-size:17px}.banner .ring{width:60px;height:60px}
    .stats{grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
    .stat .n{font-size:21px}
    .stats .stat:last-child:nth-child(odd){grid-column:1/-1}
    .grid{gap:14px}
    .card{padding:14px}
    .fgrid{grid-template-columns:1fr}
    .ci{grid-template-columns:1fr 60px 76px}
    .cgrid{grid-template-columns:1fr}
    .cal{gap:3px}
    .dow{font-size:10.5px}
    .day{min-height:54px;padding:4px;border-radius:8px;gap:3px}
    .day .dn{font-size:12px}
    .day .dn .meta{display:none}
    .day .posts{flex-direction:row;flex-wrap:wrap;gap:3px}
    .post{width:8px;height:8px;padding:0;border-radius:50%;background:var(--c);border:0}
    .post .pb,.post .pt{display:none}
    .post.done{opacity:.35}
    .post.late{background:var(--bad)}
    .calbar .m{min-width:0;flex:1;font-size:16px}
    .calbar select{width:100%!important;margin:0!important}
    .ov{align-items:flex-end;padding:0}
    .modal,.modal.wide{width:100%;border-radius:18px 18px 0 0;max-height:90vh;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
    input,select,textarea{font-size:16px}
    .x{opacity:1}
    .toast{bottom:calc(84px + env(safe-area-inset-bottom));max-width:90vw;text-align:center}
    .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
    .tile .v{font-size:13.5px}
    .daypick button{padding:9px 0}
    .filters{overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px;max-width:100%}
    .chipbtn{white-space:nowrap}
    .calc .out{font-size:13px}
  }
</style>
</head>
<body>
<div class="app">
  <header class="mtop"><div class="logo">M</div><b>Marina</b><span class="sync"></span><div class="langs"><button data-lang="en">EN</button><button data-lang="ar">ع</button></div></header>
  <aside>
    <div class="brand"><div class="logo">M</div><div><b>Marina</b><small id="tagline"></small></div></div>
    <button class="nav" data-view="today"><span class="ic">☀</span><span class="lbl" data-t="nav_today"></span><span class="lbls" data-t="ns_today"></span><span class="count" id="navToday"></span></button>
    <button class="nav" data-view="agenda"><span class="ic">📅</span><span class="lbl" data-t="nav_agenda"></span><span class="lbls" data-t="ns_agenda"></span><span class="count" id="navAgenda"></span></button>
    <button class="nav" data-view="campaigns"><span class="ic">📈</span><span class="lbl" data-t="nav_camps"></span><span class="lbls" data-t="ns_camps"></span><span class="count" id="navCamps"></span></button>
    <button class="nav" data-view="clients"><span class="ic">👥</span><span class="lbl" data-t="nav_clients"></span><span class="lbls" data-t="ns_clients"></span></button>
    <button class="nav" data-view="calendar"><span class="ic">🗓</span><span class="lbl" data-t="nav_cal"></span><span class="lbls" data-t="ns_cal"></span></button>
    <button class="nav" data-view="settings"><span class="ic">⚙</span><span class="lbl" data-t="nav_settings"></span><span class="lbls" data-t="ns_settings"></span></button>
    <div class="langs"><button data-lang="en">English</button><button data-lang="ar">عربي</button></div>
    <div class="side-foot"><div class="sync"></div><div id="sideNote"></div></div>
  </aside>
  <main id="main"></main>
</div>
<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ================= Translations ================= */
const L = {
en:{
 sync_cloud:'☁ Synced to your account', sync_saving:'⟳ Saving…', sync_local:'Saved on this device', sync_err:'⚠ Not synced — check your internet',
 side_cloud:'Your data syncs to your Claude account. Open the same link on your phone and laptop.', export_fail:'Could not save the file here — try from a computer.', restore_btn:'Restore',
 todo_today:'To do today', g_routine:'Routine', g_tasks:'Tasks', g_posts:'Posts to publish', add_appt:'+ Appointment', all_clear:'Nothing else for today ✨',
 tagline:'Media buying workspace', ns_today:'Today', ns_agenda:'Agenda', ns_camps:'Campaigns', ns_clients:'Clients', ns_cal:'Calendar', ns_settings:'Settings', nav_today:'Today', nav_camps:'Campaigns', nav_clients:'Clients', nav_cal:'Content Calendar', nav_settings:'Routine & Settings',
 side_foot:'Your data is saved in this browser. Back it up from Settings.',
 gm:'Good morning', ga:'Good afternoon', ge:'Good evening', hello:'{0}, Marina 👋',
 msg_start:'Add your clients to get started ✨', msg_done:'Everything is done for today. Amazing work! 🎉', msg_left:'You have {0} things left today', checks_done:'{0} of {1} checks completed',
 btn_task:'+ Task', btn_client:'+ Add client',
 s_active:'Active clients', s_new:'New clients to onboard', s_posts:'Posts planned today', s_overdue:'Overdue posts', s_alerts:'Campaigns needing attention',
 routine:'Daily routine', routine_empty:'No routine items — add some in Settings.',
 checkin:'Accounts & campaigns check-in', tag_active:'active clients', col_client:'Client', col_acc:'Account', col_cmp:'Campaigns', checkin_empty:'No active clients yet. Add a client and set them to Active.',
 onboard:'New clients to onboard', mark_active:'Mark active',
 content_today:"Today's content", content_empty:'Nothing scheduled to post today.', overdue:'Overdue', plan_post:'+ Plan a post', open_cal:'Open calendar →',
 mytasks:'My tasks', tasks_empty:'No extra tasks for today.', from:'from {0}', task_ph:'Add a task for today…', add:'Add',
 alerts_title:'Campaign alerts', alerts_empty:'No alerts — your campaigns look healthy.', open_camps:'Open campaigns →',

async function initCloud(){
  if(!inClaude) return;
  claude.use('downloads').then(x=>dlNs=x).catch(()=>{});
  const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]).catch(()=>[null,null]);
  const id = user ? await user.id() : null;
  if(!db || !id){ setSync('local'); return; }
  cloud={ref:db.doc('data/users/'+id+'/marina')}; render();
  let first=true; const tm=setTimeout(()=>{ if(first) setSync('err'); },10000);
  cloud.ref.onSnapshot(snap=>{
    if(snap.metadata.hasPendingWrites) return;
    const d=snap.exists?snap.data():null;
    if(d && d.state && d.rev!==lastRev){ lastRev=d.rev; S=norm(JSON.parse(JSON.stringify(d.state))); try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} render(); }
    else if(!d && first && (S.clients.length||S.events.length||S.tasks.length||S.campaigns.length)) pushCloud();
    if(!snap.metadata.fromCache){ first=false; clearTimeout(tm); if(!cloudBusy) setSync('cloud'); }
  }, ()=>{ clearTimeout(tm); setSync('err'); });
}

/* ================= Campaign analytics ================= */
function agg(es){
  const s={spend:0,impressions:0,reach:0,clicks:0,results:0,revenue:0,days:es.length};
  es.forEach(e=>['spend','impressions','reach','clicks','results','revenue'].forEach(k=>s[k]+= +e[k]||0));
  s.ctr = s.impressions? s.clicks/s.impressions*100 : NaN;
  s.cpc = s.clicks? s.spend/s.clicks : NaN;
  s.cpm = s.impressions? s.spend/s.impressions*1000 : NaN;
  s.cpr = s.results? s.spend/s.results : NaN;
  s.cvr = s.clicks? s.results/s.clicks*100 : NaN;
  s.roas = s.spend && s.revenue? s.revenue/s.spend : NaN;
  s.freq = s.reach? s.impressions/s.reach : NaN;
  return s;
}
const sorted = c => [...(c.entries||[])].sort((a,b)=>a.date.localeCompare(b.date));
function periodSets(c,p){
  const es = sorted(c); if(!es.length) return {cur:[],prev:[]};
  if(p==='7'){
    const d=new Date(); d.setDate(d.getDate()-6); const c1=key(d); d.setDate(d.getDate()-7); const c0=key(d);
    const cur=es.filter(e=>e.date>=c1); if(cur.length) return {cur, prev:es.filter(e=>e.date>=c0&&e.date<c1)};
    p='last';
  }
  if(p==='last') return {cur:[es[es.length-1]], prev: es.length>1?[es[es.length-2]]:[]};
  return {cur:es, prev:[]};
}
function analyze(c,p='7'){
  const items=[]; const add=(lvl,text)=>items.push({lvl,text});
  if(!(c.entries||[]).length){ add('info',t('i_no_data')); return {m:null,items,health:'none'}; }
  const {cur,prev}=periodSets(c,p); const m=agg(cur), pm=prev.length?agg(prev):null;
  const tc=+c.targetCpr, tr=+c.targetRoas, db=+c.dailyBudget;
  if(tc && isFinite(m.cpr)){ const r=(m.cpr-tc)/tc*100;
    if(r>20) add('bad',t('i_cpr_bad',money(m.cpr),nf(r,0),money(tc)));
    else if(r<=0) add('good',t('i_cpr_good',money(m.cpr),money(tc)));
    else add('watch',t('i_cpr_near',money(m.cpr),money(tc))); }
  if(isFinite(m.ctr) && m.impressions>=500){ if(m.ctr<0.8) add('watch',t('i_ctr_low',nf(m.ctr))); else if(m.ctr>=2) add('good',t('i_ctr_good',nf(m.ctr))); }
  if(isFinite(m.freq) && m.freq>3) add('watch',t('i_freq_high',nf(m.freq,1)));
  if(isFinite(m.cvr) && m.clicks>=30 && (!isFinite(m.ctr)||m.ctr>=0.8) && m.cvr<2 && ['sales','leads','messages'].includes(c.objective)) add('watch',t('i_cvr_low',nf(m.cvr)));
  if(isFinite(m.roas)){ if(m.roas<1) add('bad',t('i_roas_loss',nf(m.roas)));
    else if(tr && m.roas<tr) add('watch',t('i_roas_low',nf(m.roas),nf(tr)));
    else if(tr) add('good',t('i_roas_good',nf(m.roas),nf(tr))); }
  if(pm){
    if(isFinite(m.cpr)&&isFinite(pm.cpr)&&pm.cpr){ const d=(m.cpr-pm.cpr)/pm.cpr*100; if(d>25) add('watch',t('i_cpr_up',nf(d,0))); else if(d<-15) add('good',t('i_cpr_down',nf(-d,0))); }
    if(isFinite(m.cpm)&&isFinite(pm.cpm)&&pm.cpm){ const d=(m.cpm-pm.cpm)/pm.cpm*100; if(d>30) add('watch',t('i_cpm_up',nf(d,0))); }
  }
  if(db && m.days && m.spend){ const pace=m.spend/(db*m.days)*100; if(pace<70) add('watch',t('i_under',nf(pace,0))); else if(pace>125) add('watch',t('i_over',nf(pace,0))); }
  if(c.status==='active'){ const es=sorted(c); const dd=dayDiff(TODAY(),es[es.length-1].date); if(dd>=2) add('watch',t('i_stale',dd)); }
  const order={bad:0,watch:1,good:2,info:3}; items.sort((a,b)=>order[a.lvl]-order[b.lvl]);
  const health = items.some(i=>i.lvl==='bad')?'bad':items.some(i=>i.lvl==='watch')?'watch':'good';
  return {m,pm,items,health};
}

function occursOn(ev,k){
  if(k<ev.date) return false;
  if(ev.repeat==='daily') return true;
  if(ev.repeat==='weekly'){ const w=(ev.wdays&&ev.wdays.length)?ev.wdays.map(Number):[parse(ev.date).getDay()]; return w.includes(parse(k).getDay()); }
  if(ev.repeat==='monthly') return parse(k).getDate()===parse(ev.date).getDate();
  return k===ev.date;
}
const occ = (k,cat='all') => S.events.filter(e=>occursOn(e,k)&&(cat==='all'||kCat(e)===cat)).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));

/* ---------- Business ROAS calculator ---------- */
const RC_F=[['price','rc_price',600],['cost','rc_cost',250],['ship','rc_ship',50],['fees','rc_fees',5],['margin','rc_margin',15],['fixed','rc_fixed',''],['orders','rc_orders',''],['close','rc_close',10],['actual','rc_actual','']];
function roasCard(){
  S.roasCalc ||= {}; RC_F.forEach(([k,,d])=>{ if(S.roasCalc[k]===undefined) S.roasCalc[k]=d; });
  return `<div class="card" style="margin-top:18px;border-top:4px solid var(--gold)"><h2>🎯 ${t('rc_title')}</h2>
    <div class="meta" style="margin-bottom:14px">${t('rc_sub')}</div>
    <div class="calc"><div><div class="fgrid">${RC_F.map(([k,l])=>`<div><label>${t(l)}${['price','cost','ship','fixed'].includes(k)?' ('+esc(S.currency)+')':''}</label><input type="number" step="any" min="0" id="rc_${k}" value="${esc(S.roasCalc[k])}" oninput="roasRun()"></div>`).join('')}</div>
      <div class="hint" style="margin:14px 0 0">📐 ${t('rc_formula')}<br>💬 ${t('rc_msg_formula')}</div></div>
    <div id="rcOut"></div></div></div>`;
}
function roasRun(){
  const out=document.getElementById('rcOut'); if(!out) return;
  const v={}; RC_F.forEach(([k])=>{ const el=document.getElementById('rc_'+k); v[k]=el.value===''?NaN:+el.value; S.roasCalc[k]=el.value; }); save();
  const row=(l,val,d='')=>`<div class="out"><span>${l}${d?`<br><small style="font-weight:400;opacity:.8">${d}</small>`:''}</span><span dir="ltr" style="align-self:center">${val}</span></div>`;
  const price=v.price||0, fixedPO=(v.fixed>0&&v.orders>0)?v.fixed/v.orders:0;
  const profit=price-(v.cost||0)-(v.ship||0)-price*(v.fees||0)/100-fixedPO;
  if(!price){ out.innerHTML=''; return; }
  let h=fixedPO?row(t('rc_fixed_po'),money(fixedPO),t('rc_fixed_d',money(v.fixed),nf(v.orders,0))):'';
  if(profit<=0){ out.innerHTML=h+insHtml({lvl:'bad',text:t('rc_noprofit',money(profit))}); return; }
  const be=price/profit, maxM=profit/price*100, m=v.margin||0, close=v.close>0?v.close:0;
  h+=row(t('rc_profit'),money(profit))+row(t('rc_be'),nf(be)+'x',t('rc_be_d'))+row(t('rc_becpa'),money(profit));
  let target=null, exc=null, tcpa=null;
  if(m>=maxM) h+=insHtml({lvl:'watch',text:t('rc_toohigh',nf(maxM,1))});
  else { tcpa=profit-price*m/100; target=price/tcpa; exc=target*1.25;
    h+=row('🎯 '+t('rc_target'),nf(target)+'x',t('rc_target_d',nf(m,1)))+row(t('rc_tcpa'),money(tcpa))+row('🚀 '+t('rc_exc'),'≥ '+nf(exc)+'x'); }
  if(close){ h+=`<div class="meta" style="font-weight:700;margin:16px 0 0;color:var(--navy)">${t('rc_msg_title')}</div>`;
    if(tcpa) h+=row('🎯 '+t('rc_msg_t'),money(tcpa*close/100),t('rc_msg_d',nf(close,1)));
    h+=row(t('rc_msg_be'),money(profit*close/100)); }
  roasRun.cur={target,tcpa,msg:tcpa&&close?tcpa*close/100:null};
  // zones bar
  const top=Math.max((exc||be*1.6)*1.3,(v.actual||0)*1.1), P=x=>Math.min(100,x/top*100);
  const segs=[[0,be,'var(--bad)',t('z_loss')],[be,target||top,'var(--warn)',t('z_be')]];
  if(target) segs.push([target,exc,'var(--ok)',t('z_ok')],[exc,top,'#0f6b45',t('z_exc')]);
  h+=`<div style="margin-top:16px;direction:ltr"><div style="display:flex;height:14px;border-radius:8px;overflow:hidden;position:relative">${segs.map(([a,b,c])=>`<div style="width:${P(b)-P(a)}%;background:${c}"></div>`).join('')}
    ${isFinite(v.actual)&&v.actual>0?`<div style="position:absolute;left:calc(${P(v.actual)}% - 2px);top:-4px;width:4px;height:22px;background:var(--navy);border-radius:2px"></div>`:''}</div>
    <div style="position:relative;height:16px;font-size:11px;color:var(--muted)">${[be,target,exc].filter(Boolean).map(x=>`<span style="position:absolute;left:${P(x)}%;transform:translateX(-50%)">${nf(x)}x</span>`).join('')}</div></div>
    <div class="legend" style="margin-top:4px">${segs.map(([,,c,l])=>`<span><i class="dot" style="background:${c}"></i>${l}</span>`).join('')}</div>`;
  // verdict for actual ROAS
  if(isFinite(v.actual)&&v.actual>0){
    const net=profit-price/v.actual, pct=net/price*100, per1000=(1000*v.actual/price)*profit-1000;
    const lvl=net<0?'loss':target&&v.actual>=exc?'exc':target&&v.actual>=target?'ok':'be';
    h+=`<div style="margin-top:12px">${insHtml({lvl:{loss:'bad',be:'watch',ok:'good',exc:'good'}[lvl],text:t('rc_v_'+lvl,nf(v.actual),money(Math.abs(net)),nf(pct,1))})}
      ${insHtml({lvl:'info',text:t('rc_per1000',money(per1000))})}</div>`;
  }
  if(target && S.campaigns.length) h+=`<div class="row" style="margin-top:12px;flex-wrap:wrap"><span class="meta">${t('rc_apply')}</span>
    <select id="rcCamp" style="width:auto;flex:1">${S.campaigns.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>
    <button class="btn sm" onclick="roasApply()">${t('rc_apply_btn')}</button></div>`;
  out.innerHTML=h;
}
function roasApply(){
  const {target,tcpa,msg}=roasRun.cur, c=camp(document.getElementById('rcCamp').value), r=x=>Math.round(x*100)/100;
  c.targetRoas=r(target);
  if(c.objective==='sales') c.targetCpr=r(tcpa); else if(['messages','leads'].includes(c.objective)&&msg) c.targetCpr=r(msg);
  save(); render(); toast(t('rc_applied'));
}
function calcRun(){
  const v=id=>+document.getElementById(id)?.value||0; const set=(id,s)=>{const el=document.getElementById(id); if(el) el.textContent=s;};
  const b=v('cb'),c=v('cc'),n=v('cn'),p=v('cp'),m=v('cm');
  set('o1', c? nf(b/c,0) : '—'); set('o2', c? money(n*c).replace(/&amp;/g,'&') : '—');
  set('o3', p&&m? money(p*m/100).replace(/&amp;/g,'&') : '—'); set('o4', m? nf(100/m)+'x' : '—');
}
function tile(k,v,cls=''){ return `<div class="tile ${cls}"><div class="v">${v}</div><div class="k">${k}</div></div>`; }
function campCard(c){
  const a=analyze(c), m=a.m, cl=client(c.clientId), es=sorted(c);
  const cprCls = m&&+c.targetCpr&&isFinite(m.cpr) ? (m.cpr>c.targetCpr*1.2?'bad':m.cpr<=c.targetCpr?'good':'') : '';
  const top=a.items[0];
  return `<div class="card camp" style="--c:${cColor(c.clientId)}">
    <div class="top"><div><h3>${esc(c.name)}</h3><div class="meta"><i class="dot" style="background:${cColor(c.clientId)}"></i> ${esc(cl?cl.name:'—')} · ${t('obj_'+c.objective)}${c.platform?' · '+esc(c.platform):''}</div></div>
      <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end"><span class="pill ${a.health}">${t('h_'+a.health)}</span>${c.status!=='active'?`<span class="pill ${c.status}">${t('st_'+c.status)}</span>`:''}</div></div>
    ${m?`<div class="tiles">${tile(t('spend'),money(m.spend))}${tile(t('results'),nf(m.results,0))}${tile(t('cpr'),money(m.cpr),cprCls)}
      ${tile(t('ctr'),isFinite(m.ctr)?nf(m.ctr)+'%':'—')}${tile(t('cpm'),money(m.cpm))}${isFinite(m.roas)?tile(t('roas'),nf(m.roas)+'x',m.roas<1?'bad':''):tile(t('freq'),nf(m.freq,1),m.freq>3?'bad':'')}</div>`:''}
    ${top?insHtml(top):''}
    <div class="row" style="margin-top:auto"><span class="meta" style="flex:1">${es.length?t('last_upd',fmt(es[es.length-1].date)):t('never_upd')}</span>
      <button class="btn sm ghost" onclick="openEntry('${c.id}')">${t('add_nums')}</button><button class="btn sm plain" onclick="openCamp('${c.id}')">${t('details')}</button></div></div>`;
}

/* ---------- Calendar view ---------- */
function vCalendar(){
  const y=calMonth.getFullYear(), mo=calMonth.getMonth();
  const first=new Date(y,mo,1), start=new Date(first); start.setDate(1-((first.getDay()+1)%7));
  const td=TODAY(); let cells='';
  for(let i=0;i<42;i++){
    const d=new Date(start); d.setDate(start.getDate()+i); const k=key(d);
    if(i>=35 && d.getMonth()!==mo) break;
    const ps=S.posts.filter(p=>p.date===k&&(calClient==='all'||p.clientId===calClient)), done=ps.filter(p=>p.done).length;
    cells+=`<div class="day ${d.getMonth()!==mo?'out':''} ${k===td?'today':''} ${k===selDay?'sel':''}" onclick="dayClick('${k}')">
      <div class="dn"><b>${d.getDate()}</b>${ps.length?`<span class="meta">${done}/${ps.length}</span>`:''}</div>
      <div class="posts">${ps.map(p=>{const c=client(p.clientId);return `<div class="post ${p.done?'done':''} ${!p.done&&k<td?'late':''}" style="--c:${cColor(p.clientId)}" onclick="event.stopPropagation();openPost('${p.date}','${p.id}')" title="${esc((c?c.name:'')+' · '+typeLabel(p.type)+(p.title?' — '+p.title:''))}">

  const prevA=rtl()?'›':'‹', nextA=rtl()?'‹':'›';

   <div class="row"><button class="btn ghost" onclick="openPlan()">${t('monthly_plan')}</button><button class="btn" onclick="openPost('${td}')">${t('add_post')}</button></div></div>
  <div class="calbar"><button class="btn ghost sm" onclick="shiftMonth(-1)">${prevA}</button><div class="m">${first.toLocaleDateString(loc(),{month:'long',year:'numeric'})}</div><button class="btn ghost sm" onclick="shiftMonth(1)">${nextA}</button>
   <button class="btn plain sm" onclick="calMonth=new Date();calMonth.setDate(1);render()">${t('today_btn')}</button>
   <select style="width:auto;margin-inline-start:auto" onchange="calClient=this.value;render()"><option value="all">${t('all_clients')}</option>${S.clients.map(c=>`<option value="${c.id}" ${calClient===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
  <div class="cal">${(isMobile()?DOW_S:DOW)[S.lang].map(d=>`<div class="dow">${d}</div>`).join('')}${cells}</div>
  ${dayPanel}

  if(needClient()) return;
  planDays=new Set(); const mv=`${calMonth.getFullYear()}-${pad(calMonth.getMonth()+1)}`;
  modal(`<h3>${t('plan_t')}</h3><form onsubmit="savePlan(event)"><div class="fgrid">

    <div class="full"><label>${t('quick')}</label><div class="row" style="flex-wrap:wrap">
      <button type="button" class="chipbtn" onclick="quickPick('odd')">${t('qp_odd')}</button><button type="button" class="chipbtn" onclick="quickPick(3)">${t('qp_3')}</button>
      <button type="button" class="chipbtn" onclick="quickPick('wk',[0,2,4])">${t('qp_a')}</button><button type="button" class="chipbtn" onclick="quickPick('wk',[6,1,3])">${t('qp_b')}</button>
      <button type="button" class="chipbtn" onclick="quickPick('clear')">${t('clear')}</button></div></div>
    <div class="full"><label>${t('pick_days')} <span id="pc"></span></label><div class="daypick" id="dp"></div></div>
  </div>${foot('',t('add_to_cal'))}</form>`);
  drawPick(mv);
}
function drawPick(mv){
  const [y,m]=mv.split('-').map(Number), first=new Date(y,m-1,1), n=new Date(y,m,0).getDate(), off=(first.getDay()+1)%7;
  let h=DOW_S[S.lang].map(d=>`<div class="meta" style="text-align:center">${d}</div>`).join('');
  for(let i=0;i<off;i++) h+=`<button type="button" class="blank"></button>`;
  for(let d=1;d<=n;d++){ const past=`${y}-${pad(m)}-${pad(d)}`<TODAY(); if(past) planDays.delete(d);
    h+=`<button type="button" class="${planDays.has(d)?'on':''}" ${past?'disabled style="opacity:.3;cursor:default"':''} onclick="togDay(${d},this)">${d}</button>`; }
  document.getElementById('dp').innerHTML=h; updPc(); drawPick.cur={y,m,n};
}
const updPc=()=>document.getElementById('pc').textContent=planDays.size?t('selected',planDays.size):'';
function togDay(d,b){ planDays.has(d)?planDays.delete(d):planDays.add(d); b.classList.toggle('on'); updPc(); }
function quickPick(mode,wd){
  const {y,m,n}=drawPick.cur; planDays=new Set();
  if(mode!=='clear') for(let d=1;d<=n;d++){
    if(mode==='odd'&&d%2===1) planDays.add(d);
    if(typeof mode==='number'&&(d-1)%mode===0) planDays.add(d);
    if(mode==='wk'&&wd.includes(new Date(y,m-1,d).getDay())) planDays.add(d);
  }
  drawPick(`${y}-${pad(m)}`);
}
function savePlan(e){
  e.preventDefault(); if(!planDays.size){ toast(t('pick_one')); return; }
  const f=Object.fromEntries(new FormData(e.target)), [y,m]=f.month.split('-').map(Number), n=planDays.size;
  [...planDays].sort((a,b)=>a-b).forEach(d=>S.posts.push({id:uid(),clientId:f.clientId,date:`${y}-${pad(m)}-${pad(d)}`,type:f.type,title:f.title,done:false}));
  calMonth=new Date(y,m-1,1); save(); close_(); view='calendar'; render(); toast(t('planned_n',n));
}

    <div><label>${t('f_status')}</label><select name="status">${['active','paused','ended'].map(s=>`<option value="${s}" ${c.status===s?'selected':''}>${t('st_'+s)}</option>`).join('')}</select></div>
    <div><label>${t('f_daily')} (${esc(S.currency)})</label><input type="number" step="any" name="dailyBudget" value="${esc(c.dailyBudget)}"></div>
    <div><label>${t('f_target_cpr')} (${esc(S.currency)})</label><input type="number" step="any" name="targetCpr" value="${esc(c.targetCpr)}"></div>
    <div><label>${t('f_target_roas')}</label><input type="number" step="any" name="targetRoas" value="${esc(c.targetRoas)}" placeholder="e.g. 3"></div>
    <div><label>${t('f_start')}</label><input type="date" name="start" value="${esc(c.start||TODAY())}"></div>
  </div>${foot(id?`delCamp('${id}')`:'',id?t('save'):t('create_camp'))}</form>`);
}
function saveCamp(e,id){
  e.preventDefault(); const f=Object.fromEntries(new FormData(e.target));
  if(id) Object.assign(camp(id),f); else { id=uid(); S.campaigns.push({id,entries:[],...f}); }
  save(); close_(); view='campaigns'; render(); toast(t('camp_saved'));
}
function delCamp(id){ confirmBox(t('confirm_del_camp'),()=>{ S.campaigns=S.campaigns.filter(c=>c.id!==id); save(); render(); }); }

const FIELDS=[['spend','spend'],['impressions','impr'],['reach','reach'],['clicks','clicks'],['results','results'],['revenue','revenue']];
function openEntry(id,date){
  const c=camp(id), d=date||TODAY(), ex=(c.entries||[]).find(e=>e.date===d)||{};
  modal(`<h3>${t('nums_t',esc(c.name))}</h3><div class="hint">${t('nums_hint')}</div><form onsubmit="saveEntry(event,'${id}')"><div class="fgrid">
    <div class="full"><label>${t('f_date')}</label><input type="date" name="date" value="${d}" required></div>
    ${FIELDS.map(([f,l])=>`<div><label>${t(l)}${f==='spend'||f==='revenue'?' ('+esc(S.currency)+')':''}${f==='results'?' — '+t('obj_'+c.objective):''}</label><input type="number" step="any" min="0" name="${f}" value="${esc(ex[f])}" ${f==='spend'?'required':''}></div>`).join('')}
  </div>${foot('',t('save_nums'))}</form>`);
}
function saveEntry(e,id){
  e.preventDefault(); const f=Object.fromEntries(new FormData(e.target)); const c=camp(id);
  FIELDS.forEach(([k])=>f[k]=f[k]===''?0:+f[k]);
  c.entries=(c.entries||[]).filter(x=>x.date!==f.date); c.entries.push({id:uid(),...f});
  save(); render(); openCamp(id,'last'); toast(t('nums_saved'));
}
function delEntry(cid,eid){ const c=camp(cid); c.entries=c.entries.filter(e=>e.id!==eid); save(); render(); openCamp(cid); }

function spark(c){
  const es=sorted(c).slice(-14).filter(e=>e.results>0); if(es.length<2) return '';
  const vals=es.map(e=>e.spend/e.results), tc=+c.targetCpr, all=tc?[...vals,tc]:vals;
  const mx=Math.max(...all)*1.1, mn=Math.min(...all)*0.9, W=600,H=90;
  const X=i=>10+i*(W-20)/(vals.length-1), Y=v=>H-8-(v-mn)/(mx-mn||1)*(H-16);
  const pts=vals.map((v,i)=>`${X(i)},${Y(v)}`).join(' ');
  return `<h2 style="margin-top:18px">📉 ${t('trend')}</h2><svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="direction:ltr">
    ${tc?`<line x1="0" x2="${W}" y1="${Y(tc)}" y2="${Y(tc)}" stroke="#c9a24a" stroke-dasharray="6 5" stroke-width="1.5"/><text x="${W-6}" y="${Y(tc)-5}" text-anchor="end" font-size="11" fill="#8a6a1f">${t('target')} ${nf(tc)}</text>`:''}
    <polyline points="${pts}" fill="none" stroke="#0f1b33" stroke-width="2.5" stroke-linejoin="round"/>
    ${vals.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="3.5" fill="${tc&&v>tc*1.2?'#c43d3d':'#0f1b33'}"><title>${es[i].date}: ${nf(v)}</title></circle>`).join('')}</svg>`;
}
function openCamp(id,p='7'){
  const c=camp(id), cl=client(c.clientId), a=analyze(c,p), m=a.m, es=sorted(c).reverse();
  modal(`<div class="top" style="margin-bottom:14px"><div><h3 style="margin:0">${esc(c.name)}</h3><div class="meta"><i class="dot" style="background:${cColor(c.clientId)}"></i> ${esc(cl?cl.name:'')} · ${t('obj_'+c.objective)} · ${esc(c.platform||'')}${+c.dailyBudget?' · '+t('f_daily')+': '+money(+c.dailyBudget):''}${+c.targetCpr?' · '+t('target')+': '+money(+c.targetCpr):''}</div></div>
    <div class="row"><span class="pill ${a.health}">${t('h_'+a.health)}</span><button class="btn sm plain" onclick="openCampForm('${id}')">${t('edit')}</button></div></div>
    <div class="calbar"><span class="meta">${t('period')}:</span><div class="filters">${[['last','p_last'],['7','p_7'],['all','p_all']].map(([v,l])=>`<button class="chipbtn ${p===v?'on':''}" onclick="openCamp('${id}','${v}')">${t(l)}</button>`).join('')}</div>
      <button class="btn sm" style="margin-inline-start:auto" onclick="openEntry('${id}')">${t('add_nums')}</button></div>
    ${m?`<div class="tiles wide">${tile(t('spend'),money(m.spend))}${tile(t('results'),nf(m.results,0))}${tile(t('cpr'),money(m.cpr))}${tile(t('ctr'),isFinite(m.ctr)?nf(m.ctr)+'%':'—')}
      ${tile(t('cpc'),money(m.cpc))}${tile(t('cpm'),money(m.cpm))}${tile(t('freq'),nf(m.freq,1))}${tile(t('cvr'),isFinite(m.cvr)?nf(m.cvr)+'%':'—')}${tile(t('roas'),isFinite(m.roas)?nf(m.roas)+'x':'—')}
      ${tile(t('impr'),nf(m.impressions,0))}${tile(t('reach'),nf(m.reach,0))}${tile(t('clicks'),nf(m.clicks,0))}</div>`:''}
    <h2 style="margin-top:18px">💡 ${t('insights')}</h2>${a.items.map(insHtml).join('')}
    ${spark(c)}
    <h2 style="margin-top:18px">🗂 ${t('history')}</h2>
    ${es.length?`<div class="tblwrap"><table><thead><tr><th>${t('f_date')}</th><th>${t('spend')}</th><th>${t('impr')}</th><th>${t('clicks')}</th><th>${t('results')}</th><th>${t('cpr')}</th><th>${t('ctr')}</th><th>${t('revenue')}</th><th></th></tr></thead><tbody>
      ${es.map(e=>{const x=agg([e]);return `<tr><td><a href="#" onclick="event.preventDefault();openEntry('${id}','${e.date}')" style="color:var(--navy)">${fmt(e.date)}</a></td><td class="n">${nf(e.spend)}</td><td class="n">${nf(e.impressions,0)}</td><td class="n">${nf(e.clicks,0)}</td><td class="n">${nf(e.results,0)}</td><td class="n">${nf(x.cpr)}</td><td class="n">${isFinite(x.ctr)?nf(x.ctr)+'%':'—'}</td><td class="n">${e.revenue?nf(e.revenue):'—'}</td><td><button class="x" onclick="delEntry('${id}','${e.id}')">✕</button></td></tr>`}).join('')}
    </tbody></table></div>`:`<div class="empty">${t('no_entries')}</div>`}
    <div class="mfoot"><button class="btn plain" onclick="close_()">${t('cancel')}</button></div>`, true);
}

/* ================= Backup ================= */
function exportData(){
  const filename=`marina-backup-${TODAY()}.json`, data=JSON.stringify(S,null,2);
  if(dlNs){ dlNs.save({filename,data}).catch(e=>{ if(e&&e.code!=='declined') toast(t('export_fail')); }); return; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([data],{type:'application/json'})); a.download=filename; a.click();
}
function importData(inp){
  const f=inp.files[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>{ let d; try{ d=JSON.parse(r.result); if(!d.clients||!d.posts) throw 0; }catch(e){ toast(t('bad_backup')); return; }
    confirmBox(t('confirm_restore'),()=>{ S=norm(d); save(); render(); toast(t('restored')); },t('restore_btn')); };
  r.readAsText(f); inp.value='';
}

/* ================= Notifications ================= */
function askNotify(){
  if(!('Notification' in window)) return toast(t('no_notif'));
  Promise.resolve(Notification.requestPermission()).then(p=>{ render(); if(p==='granted') notifyNow(true); else toast(t('no_notif')); }).catch(()=>toast(t('no_notif')));
}
function notifyNow(force){
  if(!('Notification' in window)||Notification.permission!=='granted') return;
  const I=todayInfo(); if(!force&&S.lastNotified===I.td) return;
  const parts=[]; if(I.active.length) parts.push(t('n_check',I.active.length)); if(I.postsToday.length) parts.push(t('n_posts',I.postsToday.length));
  if(I.overdue.length) parts.push(t('n_over',I.overdue.length)); if(I.newC.length) parts.push(t('n_new',I.newC.length)); if(I.alerts.length) parts.push(t('n_alerts',I.alerts.length));
  if(I.agenda.length) parts.push(t('n_ag',I.agenda.length));
  new Notification(t('n_title'),{body:parts.length?t('n_today')+parts.join(rtl()?'، ':', '):t('n_clear')});
  S.lastNotified=I.td; save();
}
const nowHM=()=>{const n=new Date();return `${pad(n.getHours())}:${pad(n.getMinutes())}`;};
setInterval(()=>{ if(nowHM()>=S.notifyTime) notifyNow(); },60000);

/* ================= Init ================= */
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>go(b.dataset.view));
document.querySelectorAll('.langs button').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
let lastDay=TODAY(); setInterval(()=>{ if(TODAY()!==lastDay){ lastDay=TODAY(); render(); } },60000);
let wasMobile=isMobile(); addEventListener('resize',()=>{ if(isMobile()!==wasMobile){ wasMobile=isMobile(); render(); } });
if(!inClaude && window.self===window.top && 'serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
setSync(syncState); initCloud();
render();
if(nowHM()>=S.notifyTime) notifyNow();
</script>
